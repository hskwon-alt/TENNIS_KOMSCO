<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎾 실시간 공유 테니스 코트 예약 System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #27ae60; }
        .list-title { margin-top: 30px; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; color: #2c3e50; }
        ul { list-style: none; padding: 0; }
        li { background: #f8f9fa; padding: 12px; border: 1px solid #e9ecef; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .cancel-btn { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: auto; margin-top: 0; font-size: 12px; }
        .cancel-btn:hover { background-color: #c0392b; }
        .info-text { font-size: 12px; color: #7f8c8d; margin-top: 4px; }
        option:disabled { color: #aaa; background-color: #eee; }

        /* 통합 날짜 박스 커스텀 스타일 */
        .custom-date-container {
            position: relative;
            width: 100%;
        }
        .custom-date-container input[type="text"] {
            background-color: #fff;
            padding-right: 40px;
            cursor: pointer;
        }
        .custom-date-container input[type="date"] {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }
        .calendar-icon-bg {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 16px;
            z-index: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎾 테니스 코트 실시간 예약</h2>
    
    <div class="form-group">
        <label for="userName">예약자 성함(인원)</label>
        <input type="text" id="userName" placeholder="이름(예약인원)을 입력하세요">
    </div>

    <div class="form-group">
        <label for="userPassword">예약 취소용 비밀번호 (숫자 4자리)</label>
        <input type="password" id="userPassword" maxlength="4" placeholder="비밀번호 4자리 숫자">
    </div>

    <div class="form-group">
        <label for="bookingDate">예약 날짜</label>
        <div class="custom-date-container">
            <input type="text" id="bookingDateText" readonly placeholder="날짜를 선택하세요">
            <input type="date" id="bookingDate">
            <span class="calendar-icon-bg">📅</span>
        </div>
        <div class="info-text">* 오늘 기준으로 7일 이내 날짜만 예약 가능합니다.</div>
    </div>

    <div class="form-group">
        <label for="courtSelect">코트 선택</label>
        <select id="courtSelect">
            <option value="1번 코트 (인조잔디)">1번 코트 (인조잔디)</option>
            <option value="2번 코트 (클레이_인잔 옆)">2번 코트 (클레이_인잔 옆)</option>
            <option value="3번 코트 (클레이)">3번 코트 (클레이)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="timeSelect">시간대 선택 (1시간 단위 / 30분 간격)</label>
        <select id="timeSelect"></select>
    </div>

    <button id="bookBtn">예약하기</button>

    <h3 class="list-title">📋 실시간 예약 현황 목록</h3>
    <ul id="bookingList"></ul>
</div>

<!-- Firebase SDK (v9+ 모듈 방식) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase 프로젝트 설정
    const firebaseConfig = {
        apiKey: "AIzaSyBLf8wUbvC0-52_wnGaGV2ezQEyADA2OHk",
        authDomain: "tennis-court-c519a.firebaseapp.com",
        databaseURL: "https://tennis-court-c519a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tennis-court-c519a",
        storageBucket: "tennis-court-c519a.firebasestorage.app",
        messagingSenderId: "102054557591",
        appId: "1:102054557591:web:1a71f410276e1dade8f6d2"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const bookingsRef = ref(db, 'tennis_bookings');

    const dateInput = document.getElementById('bookingDate');
    const dateInputText = document.getElementById('bookingDateText');
    const userNameInput = document.getElementById('userName');
    const userPasswordInput = document.getElementById('userPassword');
    const courtSelect = document.getElementById('courtSelect');
    const timeSelect = document.getElementById('timeSelect');
    const bookBtn = document.getElementById('bookBtn');
    const listElement = document.getElementById('bookingList');

    let localBookings = [];

    // 오늘 날짜 문자열 반환 (YYYY-MM-DD)
    function getTodayString() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // 요일 계산 헬퍼 함수
    function getDayOfWeekName(dateString) {
        if (!dateString) return '';
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const [year, month, day] = dateString.split('-').map(Number);
        const dateObj = new Date(year, month - 1, day);
        return days[dateObj.getDay()];
    }

    // 텍스트 박스에 요일 포함하여 출력
    function updateDateDisplay() {
        if (dateInput.value) {
            const dayName = getDayOfWeekName(dateInput.value);
            dateInputText.value = `${dateInput.value}(${dayName})`;
        } else {
            dateInputText.value = '';
        }
    }

    // 오늘 기준 7일 날짜 제한 설정
    function setDateLimits() {
        const today = new Date();
        const maxDate = new Date();
        maxDate.setDate(today.getDate() + 6);

        const formatDate = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        dateInput.min = formatDate(today);
        dateInput.max = formatDate(maxDate);
        dateInput.value = formatDate(today);
        
        updateDateDisplay();
    }

    // 시간 문자열 "HH:MM - HH:MM"을 분 단위 [startMin, endMin]으로 변환
    function parseTimeStringToMinutes(timeStr) {
        const [start, end] = timeStr.split(' - ');
        const [sh, sm] = start.split(':').map(Number);
        const [eh, em] = end.split(':').map(Number);
        return {
            start: sh * 60 + sm,
            end: eh * 60 + em
        };
    }

    // 두 시간 범위가 겹치는지 판별
    function isTimeOverlapped(timeStr1, timeStr2) {
        const range1 = parseTimeStringToMinutes(timeStr1);
        const range2 = parseTimeStringToMinutes(timeStr2);
        return range1.start < range2.end && range1.end > range2.start;
    }

    // 06:00 - 24:00 (1시간 단위 / 30분 간격 슬라이딩) 옵션 생성
    function updateTimeSlots() {
        timeSelect.innerHTML = '';
        const selectedDate = dateInput.value;
        const selectedCourt = courtSelect.value;

        // 06:00부터 23:00 시작건까지 (종료는 24:00)
        const startMin = 6 * 60; // 360분
        const endMin = 23 * 60 + 30; // 마지막 시작 23:00 (종료 24:00)

        for (let m = startMin; m <= endMin; m += 30) {
            const sh = String(Math.floor(m / 60)).padStart(2, '0');
            const sm = String(m % 60).padStart(2, '0');
            
            const endM = m + 60; // 1시간 이용
            const eh = String(Math.floor(endM / 60)).padStart(2, '0');
            const em = String(endM % 60).padStart(2, '0');

            const timeString = `${sh}:${sm} - ${eh}:${em}`;
            const option = document.createElement('option');
            option.value = timeString;

            // 동일 날짜/코트에 시간 영역이 겹치는 기존 예약 체크
            const isBooked = localBookings.some(b => 
                b.date === selectedDate && 
                b.court === selectedCourt && 
                isTimeOverlapped(b.time, timeString)
            );

            if (isBooked) {
                option.textContent = `${timeString} (예약 불가)`;
                option.disabled = true;
            } else {
                option.textContent = timeString;
            }

            timeSelect.appendChild(option);
        }
    }

    // Firebase 실시간 동기화
    onValue(bookingsRef, (snapshot) => {
        const data = snapshot.val();
        localBookings = [];
        
        if (data) {
            Object.keys(data).forEach(key => {
                localBookings.push({ id: key, ...data[key] });
            });
        }
        
        renderBookings();
        updateTimeSlots();
    });

    // 텍스트 상자 클릭 시 달력 피커 실행
    dateInputText.addEventListener('click', () => {
        if (typeof dateInput.showPicker === 'function') {
            dateInput.showPicker();
        } else {
            dateInput.click();
        }
    });

    dateInput.addEventListener('change', () => {
        updateDateDisplay();
        updateTimeSlots();
    });
    
    courtSelect.addEventListener('change', updateTimeSlots);

    // 예약 신청
    bookBtn.addEventListener('click', () => {
        const name = userNameInput.value.trim();
        const password = userPasswordInput.value.trim();
        const date = dateInput.value;
        const court = courtSelect.value;
        const time = timeSelect.value;

        if (!name) {
            alert('예약자 성함을 입력해 주세요.');
            return;
        }
        if (!password || password.length !== 4 || isNaN(password)) {
            alert('비밀번호는 숫자 4자리로 입력해 주세요.');
            return;
        }
        if (!date) {
            alert('날짜를 선택해 주세요.');
            return;
        }

        if (date < dateInput.min || date > dateInput.max) {
            alert('❌ 예약은 오늘부터 7일 이내의 날짜만 가능합니다.');
            return;
        }

        // 중복/시간 겹침 최종 검증
        const isDuplicate = localBookings.some(b => 
            b.date === date && 
            b.court === court && 
            isTimeOverlapped(b.time, time)
        );

        if (isDuplicate) {
            alert('❌ 이미 해당 시간대와 겹치는 코트 예약이 존재합니다.');
            return;
        }

        push(bookingsRef, {
            name: name,
            password: password,
            date: date,
            court: court,
            time: time,
            createdAt: Date.now()
        }).then(() => {
            alert('✅ 예약이 완료되었습니다!');
            userNameInput.value = '';
            userPasswordInput.value = '';
        }).catch((err) => {
            alert('오류가 발생했습니다: ' + err.message);
        });
    });

    // 예약 취소
    window.deleteBooking = function(id) {
        const targetBooking = localBookings.find(b => b.id === id);
        if (!targetBooking) return;

        const inputPw = prompt('예약 시 설정한 비밀번호 4자리를 입력하세요:');
        
        if (inputPw === null) return;

        if (inputPw === String(targetBooking.password)) {
            if (confirm('예약을 취소하시겠습니까?')) {
                const itemRef = ref(db, `tennis_bookings/${id}`);
                remove(itemRef).then(() => {
                    alert('✅ 예약이 성공적으로 취소되었습니다.');
                }).catch((err) => {
                    alert('취소 처리 실패: ' + err.message);
                });
            }
        } else {
            alert('❌ 비밀번호가 일치하지 않습니다. 취소할 수 없습니다.');
        }
    };

    // 실시간 예약 현황 목록 렌더링
    function renderBookings() {
        listElement.innerHTML = '';

        const todayStr = getTodayString();
        const upcomingBookings = localBookings.filter(b => b.date >= todayStr);

        if (upcomingBookings.length === 0) {
            listElement.innerHTML = '<li style="justify-content: center; color: #7f8c8d;">예약 내역이 없습니다.</li>';
            return;
        }

        upcomingBookings.sort((a, b) => {
            if (a.date === b.date) {
                return a.time.localeCompare(b.time);
            }
            return a.date.localeCompare(b.date);
        });

        upcomingBookings.forEach(b => {
            const dayName = getDayOfWeekName(b.date);
            const li = document.createElement('li');
            li.innerHTML = `
                <div>
                    <strong>${b.date}(${dayName})</strong> | ${b.court} | ${b.time}<br>
                    <small style="color: #555;">예약자: ${b.name}</small>
                </div>
                <button class="cancel-btn" onclick="deleteBooking('${b.id}')">취소</button>
            `;
            listElement.appendChild(li);
        });
    }

    // 초기화 실행
    setDateLimits();
    updateTimeSlots();
</script>

</body>
</html>
